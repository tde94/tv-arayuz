<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Ana Ekran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="photo" id="photo-a"></div>
    <div class="photo" id="photo-b"></div>
    <div class="shade"></div>
    <div class="glow" id="glow"></div>

    <header class="top">
      <div class="time-block">
        <div class="greeting" id="greeting"></div>
        <div class="time-line">
          <span class="clock" id="clock">--:--</span>
          <span class="divider"></span>
          <span class="date" id="date"></span>
        </div>
      </div>

      <nav class="pills" id="pills">
        <div class="pill pill-static" id="weather" hidden>
          <span id="weather-icon"></span>
          <span id="weather-text"></span>
        </div>
      </nav>
    </header>

    <main class="shelf">
      <h1 class="focus-title" id="focus-title">Netflix</h1>
      <div class="tray">
        <div class="track" id="track">
          <button class="app" data-app="netflix" data-glow="#C4121A">
            <span class="face face-netflix"><span class="wm-netflix">NETFLIX</span></span>
          </button>
          <button class="app" data-app="youtube" data-glow="#C8102E">
            <span class="face face-youtube">
              <svg viewBox="0 0 40 28" class="yt-play" aria-hidden="true"><rect width="40" height="28" rx="8" fill="#FF0033"/><path d="M16 8v12l10-6z" fill="#fff"/></svg>
              <span class="wm">YouTube</span>
            </span>
          </button>
          <button class="app" data-app="tv" data-glow="#B00A14">
            <span class="face face-tv">
              <svg viewBox="0 0 64 64" class="glyph" aria-hidden="true">
                <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
                  <rect x="6" y="16" width="52" height="34" rx="5"/><path d="M24 6l8 10 8-10M22 56h20"/>
                </g>
                <circle cx="47" cy="25" r="3.5" fill="#fff"/>
              </svg>
              <span class="wm">Canlı TV</span>
            </span>
          </button>
          <button class="app" data-app="tabii" data-glow="#3A3A3A">
            <span class="face face-tabii"><span class="wm wm-tabii">tabii</span></span>
          </button>
          <button class="app" data-app="tod" data-glow="#5B1A86">
            <span class="face face-tod"><span class="wm wm-tod">TOD</span></span>
          </button>
          <button class="app" data-app="prime" data-glow="#0B6FD6">
            <span class="face face-prime"><span class="wm wm-prime">prime video</span></span>
          </button>
          <button class="app" data-app="disney" data-glow="#1B3E9A">
            <span class="face face-disney"><span class="wm wm-disney">Disney+</span></span>
          </button>
          <button class="app" data-app="spotify" data-glow="#14833F">
            <span class="face face-spotify">
              <svg viewBox="0 0 64 64" class="glyph" aria-hidden="true">
                <circle cx="32" cy="32" r="28" fill="#1ED760"/>
                <g fill="none" stroke="#000" stroke-linecap="round">
                  <path d="M17 24c10-3.5 21-2.8 30 2" stroke-width="4.2"/>
                  <path d="M19 33c8.5-2.8 17.5-2 24.5 1.8" stroke-width="3.5"/>
                  <path d="M21 41.5c6.5-2 13.5-1.4 19 1.4" stroke-width="2.8"/>
                </g>
              </svg>
              <span class="wm">Spotify</span>
            </span>
          </button>
          <button class="app" data-app="browser" data-glow="#5A3FD0">
            <span class="face face-browser">
              <svg viewBox="0 0 64 64" class="glyph" aria-hidden="true">
                <g fill="none" stroke="#fff" stroke-width="3">
                  <circle cx="32" cy="32" r="24"/><ellipse cx="32" cy="32" rx="10" ry="24"/><path d="M8 32h48M12 20h40M12 44h40"/>
                </g>
              </svg>
              <span class="wm">Internet</span>
            </span>
          </button>
          <button class="app" data-app="smartthings" data-glow="#0E8F8C">
            <span class="face face-st">
              <svg viewBox="0 0 64 64" class="glyph" aria-hidden="true">
                <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
                  <path d="M12 30 32 13l20 17v21H12z"/><circle cx="32" cy="37" r="6"/>
                </g>
              </svg>
              <span class="wm">SmartThings</span>
            </span>
          </button>
        </div>
      </div>

      <div class="previews-row" id="previews-row" hidden>
        <div class="previews-title" id="previews-title"></div>
        <div class="previews" id="previews"></div>
      </div>

      <div class="devices" id="devices"></div>
    </main>

    <aside class="weekly" id="weekly" hidden aria-label="7 günlük hava durumu">
      <div class="forecast" id="forecast"></div>
      <p class="today-summary" id="today-summary"></p>
    </aside>

    <p class="photo-credit" id="photo-credit"></p>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Canlı TV: ana ekranın üstünde tam ekran oynatıcı -->
  <div class="tv" id="tv" hidden>
    <video id="tv-video" autoplay playsinline></video>
    <div class="tv-status" id="tv-status"></div>
    <div class="tv-banner" id="tv-banner">
      <img class="tv-logo" id="tv-logo" alt="">
      <div>
        <div class="tv-name" id="tv-name"></div>
        <div class="tv-meta" id="tv-meta"></div>
      </div>
    </div>
    <div class="tv-list" id="tv-list" hidden></div>
  </div>

  <script src="config.js"></script>
  <script src="secrets.js"></script>
  <script src="channels.js"></script>
  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
